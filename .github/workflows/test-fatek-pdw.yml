name: Test FATEK WinProLadder tools

on:
  push:
    paths:
      - "FATEK/WinProLadder/pdw_tools/**"
      - "FATEK/WinProLadder/ldr_tools/**"
      - ".github/workflows/test-fatek-pdw.yml"
  pull_request:
    paths:
      - "FATEK/WinProLadder/pdw_tools/**"
      - "FATEK/WinProLadder/ldr_tools/**"
      - ".github/workflows/test-fatek-pdw.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile analyzers
        run: |
          python -m py_compile FATEK/WinProLadder/pdw_tools/analyze.py
          python -m py_compile FATEK/WinProLadder/ldr_tools/analyze.py

      - name: Run PDW writer regression tests
        run: python -m unittest FATEK/WinProLadder/pdw_tools/test_minimal_writer.py

      - name: Show CLI help
        run: |
          python FATEK/WinProLadder/pdw_tools/analyze.py --help
          python FATEK/WinProLadder/ldr_tools/analyze.py --help
